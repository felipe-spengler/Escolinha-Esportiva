version: '3.8'

services:
  db:
    image: mysql:8.0
    # container_name: projeto-igreja-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: escolinha_esporte
      MYSQL_ROOT_PASSWORD: root
    # ports:
    #   - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  backend:
    networks:
      - coolify
      - default
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_NAME=EscolinhaEsporte
      - APP_ENV=production
      - APP_KEY=base64:66D7D3C6E5A4B3C2D1E0F9A8B7C6D5E4F3A2B1C0D9E=
      - APP_DEBUG=true
      - APP_URL=https://escolinha.techinteligente.site
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=escolinha_esporte
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - db


  frontend:
    networks:
      - coolify
      - default
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # ports:
    #   - "5173:5173"
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=https://api.escolinha.techinteligente.site/api


volumes:
  dbdata:

networks:
  coolify:
    external: true
